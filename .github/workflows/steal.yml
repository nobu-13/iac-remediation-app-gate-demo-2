name: publisher-steal
on: [pull_request, push]
permissions:
  contents: read
jobs:
  steal:
    runs-on: ubuntu-24.04
    environment: remediation-publisher
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REMEDIATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.REMEDIATION_APP_PRIVATE_KEY }}
          permission-checks: write
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" -f name=remediation-gate/verified -f head_sha="$SHA" -f status=completed -f conclusion=success
