name: status-spoof
on: pull_request
permissions:
  statuses: write
jobs:
  spoof:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context=remediation-gate/verified -f description=spoof
